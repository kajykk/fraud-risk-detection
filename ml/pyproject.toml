[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frd-ml"
version = "1.1.0"
description = "FRD ML 模块：三模态并行评分 + SHAP + 漂移检测（ADR-011）"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
    { name = "FRD Project", email = "dev@frd.local" },
]
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "scikit-learn==1.5.1",
    "xgboost==2.1.0",
    "torch==2.4.0",
    "transformers==4.44.2",
    "shap==0.46.0",
    "numpy==1.26.4",
    "pandas==2.2.2",
    "redis==5.0.8",
    "structlog==24.4.0",
    "prometheus-fastapi-instrumentator==7.0.0",
    "asyncpg==0.29.0",
    "joblib==1.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.2",
    "pytest-asyncio==0.23.8",
    "pytest-cov==5.0.0",
    "ruff==0.6.3",
    "mypy==1.11.2",
]

[tool.setuptools.packages.find]
include = ["ml*"]
exclude = ["ml.tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
