# ============================================================
# FRD Frontend 默认配置
# 依据：FRD-D10-V1.1 §3.2 / §9.2 TLS / docker-compose.yml frontend
# replicas=2（依据任务参数）
# 镜像：nginx:1.27-alpine 基础，Vue 静态资源
# ============================================================

nameOverride: ""
fullnameOverride: ""
namespace: frd-prod

# ---------- 镜像 ----------
image:
  registry: registry.cn-hangzhou.aliyuncs.com
  namespace: frd
  repository: frd-frontend
  tag: "1.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: aliyun-acr-secret

# ---------- Deployment ----------
replicaCount: 2   # 任务参数：前端 replicas=2

deployment:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

# ---------- 容器 ----------
container:
  name: frontend
  port: 80   # nginx HTTP
  # nginx 启动命令（前台运行）
  command: ["nginx", "-g", "daemon off;"]
  args: []

  # 健康检查
  readinessProbe:
    httpGet:
      path: /healthz
      port: 80
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3

  livenessProbe:
    httpGet:
      path: /healthz
      port: 80
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

  securityContext:
    runAsNonRoot: true
    runAsUser: 101   # nginx alpine 默认用户
    runAsGroup: 101
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
      add:
        - NET_BIND_SERVICE   # nginx 绑定 80 端口

podSecurityContext:
  fsGroup: 101
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# ---------- 资源（依据 D10 §3.2：50MB 镜像，轻量） ----------
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# ---------- Service ----------
service:
  type: ClusterIP
  port: 80
  targetPort: 80
  protocol: TCP

# ---------- Ingress（含 TLS） ----------
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-connections: "10"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: frd.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: frd-frontend-tls
      hosts:
        - frd.example.com

# ---------- 后端 API 代理 ----------
# nginx 反向代理 /api/* → frd-backend:8000
backend:
  serviceName: frd-backend
  servicePort: 8000

# ---------- 配置 ----------
config:
  VITE_API_BASE_URL: "/api/v1"
  VITE_APP_NAME: "fraud-risk-detection"
  VITE_APP_VERSION: "1.1.0"
  NGINX_GZIP: "on"

# ---------- 亲和性 ----------
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: frd-frontend
          topologyKey: kubernetes.io/hostname

nodeSelector: {}
tolerations: []

dnsPolicy: ClusterFirst
restartPolicy: Always
terminationGracePeriodSeconds: 30
