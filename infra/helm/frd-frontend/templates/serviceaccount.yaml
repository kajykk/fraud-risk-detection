{{/*
FRD Frontend 专用 ServiceAccount（最小权限：不自动挂载令牌，无附加权限）
*/}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "frd-frontend.serviceAccountName" . }}
  namespace: {{ include "frd-frontend.namespace" . }}
  labels:
    {{- include "frd-frontend.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
