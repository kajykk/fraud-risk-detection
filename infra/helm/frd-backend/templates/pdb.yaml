{{/*
FRD Backend PDB
依据：FRD-D10-V1.1 §6.5 / 任务要求 minAvailable=4（生产）
*/}}
{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "frd-backend.fullname" . }}-pdb
  namespace: {{ include "frd-backend.namespace" . }}
  labels:
    {{- include "frd-backend.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "frd-backend.selectorLabels" . | nindent 6 }}
{{- end }}
