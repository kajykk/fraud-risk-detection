{{/*
FRD Backend Secret（敏感配置）
依据：FRD-D10-V1.1 §9.3 密钥管理
生产环境必须通过 ExternalSecrets + 阿里云 KMS Secret Manager 注入
默认占位仅用于 dev/test
*/}}
{{- if .Values.secret.enabled }}
{{- if .Values.secret.externalSecretRef }}
# 生产环境：通过 ExternalSecret 引用阿里云 KMS Secret Manager
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "frd-backend.fullname" . }}-secret
  namespace: {{ include "frd-backend.namespace" . }}
  labels:
    {{- include "frd-backend.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.secret.externalSecretRef }}
    kind: SecretStore
  target:
    name: {{ include "frd-backend.fullname" . }}-secret
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: frd/prod/postgres-password
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: frd/prod/redis-password
    - secretKey: NEO4J_PASSWORD
      remoteRef:
        key: frd/prod/neo4j-password
    - secretKey: JWT_SECRET_KEY
      remoteRef:
        key: frd/prod/jwt-secret-key
    - secretKey: PII_FERNET_KEY
      remoteRef:
        key: frd/prod/pii-fernet-key
    - secretKey: WEBHOOK_SIGNING_KEY
      remoteRef:
        key: frd/prod/webhook-signing-key
---
{{- end }}
{{- if not .Values.secret.externalSecretRef }}
# dev/test 占位 Secret（生产禁用，使用 ExternalSecret）
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "frd-backend.fullname" . }}-secret
  namespace: {{ include "frd-backend.namespace" . }}
  labels:
    {{- include "frd-backend.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook-delete-policy: BeforeHookCreation
type: Opaque
data:
  {{- range $key, $value := .Values.secret.data }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
{{- end }}
{{- end }}
