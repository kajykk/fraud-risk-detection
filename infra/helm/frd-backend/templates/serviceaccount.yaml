{{/*
FRD Backend ServiceAccount：最小权限（不与 default SA 共享，配合 NetworkPolicy/RBAC 收敛）
依据：FRD-D10-V1.1 §6.3 / PCI-DSS v4.0 最小权限原则
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frd-backend-sa
  namespace: {{ include "frd-backend.namespace" . }}
  labels:
    {{- include "frd-backend.labels" . | nindent 4 }}
automountServiceAccountToken: false
