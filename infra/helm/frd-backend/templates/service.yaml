{{/*
FRD Backend Service
依据：FRD-D10-V1.1 §6.3 / 任务要求 ClusterIP 8000
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "frd-backend.fullname" . }}
  namespace: {{ include "frd-backend.namespace" . }}
  labels:
    {{- include "frd-backend.labels" . | nindent 4 }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: {{ .Values.service.protocol }}
      appProtocol: http
  selector:
    {{- include "frd-backend.selectorLabels" . | nindent 4 }}
    app: frd-backend
