{{/*
FRD Backend ConfigMap（非敏感配置）
依据：FRD-D10-V1.1 §6.3 / §6.6 NetworkPolicy 配置规范
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "frd-backend.fullname" . }}-config
  namespace: {{ include "frd-backend.namespace" . }}
  labels:
    {{- include "frd-backend.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
