# ============================================================
# FRD Backend 生产配置覆盖
# 依据：对齐 FRD-BASELINE-V1.1 §8.1 与 D10 §1.3
# 生产：replicas=3 / HPA 3-9 / PDB minAvailable=2 / NetworkPolicy 启用
# ============================================================

# ---------- 副本数（生产 3，对齐 FRD-BASELINE-V1.1 §8.1 与 D10 §1.3） ----------
replicaCount: 3

# ---------- 镜像 tag（生产固定 1.1.0） ----------
image:
  tag: "1.1.0"

# ---------- Deployment 策略 ----------
deployment:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0   # 生产零中断

# ---------- 资源（生产提升） ----------
resources:
  requests:
    cpu: 1000m
    memory: 2Gi
  limits:
    cpu: 4000m
    memory: 8Gi

# ---------- HPA（生产：min=3, max=9，CPU/内存/TPS 三指标） ----------
hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 9
  metrics:
    cpu:
      target:
        type: Utilization
        averageUtilization: 70
    memory:
      target:
        type: Utilization
        averageUtilization: 80
    # TPS 指标（依据 D10 §6.4 http_requests_per_second）
    pods:
      metric:
        name: http_requests_per_second
      target:
        type: AverageValue
        averageValue: "500"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60

# ---------- PDB（生产：minAvailable=2） ----------
pdb:
  enabled: true
  minAvailable: 2

# ---------- NetworkPolicy（生产强制启用） ----------
networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: frd-ingress
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app: postgresql
      ports:
        - protocol: TCP
          port: 5432
    # Redis
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    # Neo4j
    - to:
        - podSelector:
            matchLabels:
              app: neo4j
      ports:
        - protocol: TCP
          port: 7687
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # HTTPS 出口（阿里云 KMS / OSS / LLM API）
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443

# ---------- 生产配置覆盖 ----------
config:
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  OTEL_TRACES_SAMPLER_ARG: "0.1"   # 生产 10% 采样

# ---------- 节点选择器（绑定 API 节点池） ----------
nodeSelector:
  role: api

# ---------- 亲和性（生产强化跨节点反亲和） ----------
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: frd-backend
          topologyKey: kubernetes.io/hostname
