# ============================================================
# FRD 镜像构建与推送流水线
# 依据：FRD-D10-V1.1 §5 容器化与镜像 / §10 CI/CD
# 触发：push tag v*
# 仓库：registry.cn-hangzhou.aliyuncs.com/frd/{image}:{tag}
# 流程：构建（本地）→ 漏洞扫描（Trivy HIGH/CRITICAL，不通过则不推送）
#       → 推送 → Cosign 签名
# ============================================================
name: Build & Push Images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

env:
  REGISTRY: registry.cn-hangzhou.aliyuncs.com
  NAMESPACE: frd

jobs:
  # ---------- 5 个镜像并行构建（matrix） ----------
  build:
    name: Build & Push ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: frd-backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - image: frd-worker
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - image: frd-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - image: frd-ml-serving
            context: ./ml
            dockerfile: ./ml/Dockerfile
          - image: frd-gnn-serving
            context: ./gnn
            dockerfile: ./gnn/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Parse version from tag
        id: meta
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${TAG}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "full_image=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
          echo "local_image=frd/${{ matrix.image }}:${TAG}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      # ---------- 第一步：仅构建本地镜像（不推送） ----------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image locally (no push)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ steps.meta.outputs.local_image }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}

      # ---------- 第二步：漏洞扫描本地镜像（HIGH/CRITICAL 失败即中止） ----------
      - name: Trivy vulnerability scan (local image, gate before push)
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ steps.meta.outputs.local_image }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          format: sarif
          output: trivy-${{ matrix.image }}.sarif

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

      # ---------- 第三步：扫描通过后才登录并推送 ----------
      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ steps.meta.outputs.full_image }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.full_image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}

      - name: Extract image digest
        id: digest
        run: echo "digest=${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"

      # ---------- Cosign 签名（keyless，OIDC） ----------
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Cosign sign image (keyless)
        run: |
          cosign sign --yes \
            ${{ steps.meta.outputs.full_image }}:${{ steps.meta.outputs.image_tag }}@${{ steps.digest.outputs.digest }}

      - name: Cosign verify signature
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            ${{ steps.meta.outputs.full_image }}:${{ steps.meta.outputs.image_tag }}

      - name: Summary
        run: |
          echo "## Image: ${{ matrix.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: \`${{ steps.meta.outputs.image_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Digest: \`${{ steps.digest.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trivy scan on local image (HIGH,CRITICAL): PASS (before push)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cosign signature: SIGNED (keyless)" >> "$GITHUB_STEP_SUMMARY"
