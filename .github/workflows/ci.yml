# ============================================================
# FRD 主 CI 流水线
# 依据：FRD-D10-V1.1 §10 CI/CD 流水线
# 触发：push 到 main/develop，PR 到 main
# 所有 job 并行执行，全部通过才允许 merge（branch protection 配置）
# ============================================================
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- 后端 lint：ruff + mypy ----------
  lint-backend:
    name: Lint Backend (ruff + mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy
      - name: Ruff check
        run: ruff check app tests
      - name: Mypy type check
        run: mypy app --ignore-missing-imports --explicit-package-bases
        continue-on-error: true

  # ---------- 前端 lint：vue-tsc + eslint ----------
  lint-frontend:
    name: Lint Frontend (vue-tsc + eslint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npx eslint --max-warnings=0 src
      - name: Vue TypeScript check
        run: npx vue-tsc --noEmit

  # ---------- 后端测试：pytest + coverage ----------
  # 阈值分阶段提升计划：
  #   阶段一：40%（已废弃）—— 保住存量，防止回退
  #   阶段二（当前）：50% —— services 层定向补测后实测 71%，留出波动余量
  #   阶段三（下一阶段）：60%+ —— api/v1 层（rules/models/reports/cases）补齐单测后提升
  #   长期目标   ：85%  —— 与 D07 测试设计对齐
  test-backend:
    name: Test Backend (pytest + coverage >= 50%)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: frd
          POSTGRES_PASSWORD: frd_dev_password
          POSTGRES_DB: frd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U frd"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: frd
      POSTGRES_USER: frd
      POSTGRES_PASSWORD: frd_dev_password
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      APP_SECRET_KEY: ${{ format('ci-test-app-secret-{0}-{1}', github.run_id, github.sha) }}
      JWT_SECRET_KEY: ${{ format('ci-test-jwt-secret-{0}-{1}', github.run_id, github.sha) }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio
      - name: Apply migrations
        run: PYTHONPATH=. alembic upgrade head
      - name: Run pytest with coverage
        run: |
          pytest \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=50 \
            --asyncio-mode=auto
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 14
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          fail_ci_if_error: false

  # ---------- ML 服务检查：ruff + mypy + pytest ----------
  check-ml:
    name: Check ML (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy
      - name: Ruff check
        run: ruff check .
      - name: Mypy type check
        run: mypy . --ignore-missing-imports --explicit-package-bases
      - name: Run pytest
        run: pytest --asyncio-mode=auto

  # ---------- GNN 服务检查：ruff + mypy + pytest ----------
  check-gnn:
    name: Check GNN (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gnn
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gnn/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy
      - name: Ruff check
        run: ruff check .
      - name: Mypy type check
        run: mypy . --ignore-missing-imports --explicit-package-bases
      - name: Run pytest
        run: pytest --asyncio-mode=auto

  # ---------- 前端测试：vitest ----------
  test-frontend:
    name: Test Frontend (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run vitest
        run: npx vitest run --coverage

  # ---------- 构建检查：docker build（不推送） ----------
  build-check:
    name: Docker Build Check (no push)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: frd-backend
            context: ./backend
          - image: frd-frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.image }} (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          tags: frd/${{ matrix.image }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
