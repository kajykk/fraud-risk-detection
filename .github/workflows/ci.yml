# ============================================================
# FRD 主 CI 流水线
# 依据：FRD-D10-V1.1 §10 CI/CD 流水线
# 触发：push 到 main/develop，PR 到 main
# 所有 job 并行执行，全部通过才允许 merge（branch protection 配置）
# ============================================================
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- 后端 lint：ruff + mypy ----------
  lint-backend:
    name: Lint Backend (ruff + mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy
      - name: Ruff check
        run: ruff check app tests
      - name: Mypy type check
        run: mypy app --ignore-missing-imports

  # ---------- 前端 lint：vue-tsc + eslint ----------
  lint-frontend:
    name: Lint Frontend (vue-tsc + eslint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npx eslint --max-warnings=0 src
      - name: Vue TypeScript check
        run: npx vue-tsc --noEmit

  # ---------- 后端测试：pytest + coverage ----------
  # 阈值分阶段提升计划（当前基线 40%）：
  #   阶段一（现在）：40%  —— 保住存量，防止回退
  #   阶段二（Q4）  ：60%  —— 核心链路（scoring/rules/cases）补齐单测后
  #   阶段三（长期）：85%  —— 与 D07 测试设计对齐
  test-backend:
    name: Test Backend (pytest + coverage >= 40%)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio
      - name: Run pytest with coverage
        run: |
          pytest \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=40 \
            --asyncio-mode=auto
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 14

  # ---------- ML 服务检查：ruff + mypy + pytest ----------
  check-ml:
    name: Check ML (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy
      - name: Ruff check
        run: ruff check .
      - name: Mypy type check
        run: mypy . --ignore-missing-imports
      - name: Run pytest
        run: pytest --asyncio-mode=auto

  # ---------- GNN 服务检查：ruff + mypy + pytest ----------
  check-gnn:
    name: Check GNN (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gnn
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gnn/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy
      - name: Ruff check
        run: ruff check .
      - name: Mypy type check
        run: mypy . --ignore-missing-imports
      - name: Run pytest
        run: pytest --asyncio-mode=auto

  # ---------- 前端测试：vitest ----------
  test-frontend:
    name: Test Frontend (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run vitest
        run: npx vitest run --coverage

  # ---------- 构建检查：docker build（不推送） ----------
  build-check:
    name: Docker Build Check (no push)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: frd-backend
            context: ./backend
          - image: frd-frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.image }} (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          tags: frd/${{ matrix.image }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
