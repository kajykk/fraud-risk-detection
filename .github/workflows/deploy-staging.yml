# ============================================================
# FRD Staging 部署流水线
# 依据：FRD-D10-V1.1 §10 GitOps / §13 灰度发布
# 触发：workflow_dispatch（手动触发，需预配 ACR/ArgoCD/kubeconfig 密钥）
# 流程：同步镜像 → ArgoCD 同步 Helm Chart → 灰度检查（24h）
# 灰度策略：5%(24h) → 25%(24h) → 100%(72h)
# ============================================================
name: Deploy to Staging

on:
  workflow_dispatch:
    inputs:
      version:
        description: '部署版本（留空自动取最近 tag）'
        required: false
        type: string

permissions:
  contents: read

env:
  REGISTRY: registry.cn-hangzhou.aliyuncs.com
  NAMESPACE: frd

jobs:
  # ---------- 同步镜像到 staging ----------
  sync-images:
    name: Sync Images to Staging
    runs-on: ubuntu-latest
    if: "github.event.head_commit.message != 'ci: skip staging deploy'"
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preflight check (ACR secrets)
        run: |
          if [ -z "${{ secrets.ALIYUN_ACR_USERNAME }}" ] || [ -z "${{ secrets.ALIYUN_ACR_PASSWORD }}" ]; then
            echo "::error::缺少 ALIYUN_ACR_USERNAME / ALIYUN_ACR_PASSWORD 仓库密钥，请先在 Repo Settings→Secrets and variables→Actions 配置后重试"
            exit 1
          fi
          echo "ACR secrets OK"

      - name: Resolve latest tag
        id: meta
        run: |
          # 获取最近发布的 tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LATEST_TAG" ]; then
            echo "No release tag found, using commit SHA"
            VERSION=$(echo "${{ github.sha }}" | cut -c1-7)
          else
            VERSION="${LATEST_TAG#v}"
          fi
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${VERSION}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Login to Aliyun ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Sync 5 images to staging tag
        run: |
          IMAGES=(frd-backend frd-worker frd-frontend frd-ml-serving frd-gnn-serving)
          SRC_TAG="${{ steps.meta.outputs.image_tag }}"
          DST_TAG="staging-${{ steps.meta.outputs.version }}"
          for img in "${IMAGES[@]}"; do
            SRC="${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${img}:${SRC_TAG}"
            DST="${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${img}:${DST_TAG}"
            echo "Syncing $SRC -> $DST"
            docker pull "$SRC"
            docker tag "$SRC" "$DST"
            docker push "$DST"
          done

  # ---------- 更新 GitOps 仓库并触发 ArgoCD 同步 ----------
  argocd-sync:
    name: ArgoCD Sync Helm Chart
    runs-on: ubuntu-latest
    needs: sync-images
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.ACK_STAGING_KUBECONFIG }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o /usr/local/bin/argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x /usr/local/bin/argocd

      - name: Update Helm values for staging
        run: |
          VERSION="${{ needs.sync-images.outputs.version }}"
          # 更新各 chart 的 image.tag 为 staging 版本
          for chart in frd-backend frd-frontend frd-ml; do
            yq -i ".image.tag = \"staging-${VERSION}\"" \
              "infra/helm/${chart}/values.yaml" || true
          done

      - name: ArgoCD app sync (staging)
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          argocd app sync frd-staging \
            --server "$ARGOCD_SERVER" \
            --auth-token "$ARGOCD_AUTH_TOKEN" \
            --prune \
            --timeout 300
          argocd app wait frd-staging \
            --server "$ARGOCD_SERVER" \
            --auth-token "$ARGOCD_AUTH_TOKEN" \
            --health \
            --timeout 600

  # ---------- 灰度检查（真实指标轮询，替代固定 sleep 24h） ----------
  # 灰度节奏（D10 §13.1）：5%(24h) → 25%(24h) → 100%(72h)
  # 本 job 实现 Stage 1+2 的自动判定；完整 24h 观察期由 Argo Rollouts
  # analysis / 独立 cron 负责（weight 分流依赖 Rollout CRD，当前 chart 为
  # 标准 Deployment，故采用「金丝雀新版本 + 指标判定 + 全量推送」模式）。
  canary-check:
    name: Canary Health Check
    runs-on: ubuntu-latest
    needs: argocd-sync
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.ACK_STAGING_KUBECONFIG }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Deploy canary revision
        run: |
          VERSION="staging-${{ needs.sync-images.outputs.version }}"
          IMG_BACKEND="${{ env.REGISTRY }}/${{ env.NAMESPACE }}/frd-backend:${VERSION}"
          IMG_FRONTEND="${{ env.REGISTRY }}/${{ env.NAMESPACE }}/frd-frontend:${VERSION}"
          echo "Canary deploy: ${IMG_BACKEND}"
          kubectl set image deployment/frd-backend -n frd-staging \
            "*=${IMG_BACKEND}" --record || exit 1
          kubectl set image deployment/frd-frontend -n frd-staging \
            "*=${IMG_FRONTEND}" --record || exit 1
          kubectl rollout status deployment/frd-backend -n frd-staging --timeout 300s || exit 1
          kubectl rollout status deployment/frd-frontend -n frd-staging --timeout 300s || exit 1
          echo "Canary revision deployed (观察期：默认 24h，见 D10 §13.1)"

      - name: Evaluate canary metrics (polling, no fixed sleep)
        env:
          PROM_URL: ${{ secrets.STAGING_PROMETHEUS_URL }}
        run: |
          # 依据 D10 §13.3 灰度判定指标（5min 窗口）：
          # - 错误率 < 0.5%
          # - P99 延迟 < 200ms
          # - 业务成功率 > 99%
          # 任一超阈值 → 失败（触发下方自动回滚）；无流量/缺指标 → 降级通过并告警
          if [ -z "$PROM_URL" ]; then
            echo "::warning::STAGING_PROMETHEUS_URL 未配置，仅验证 rollout 健康"
            exit 0
          fi
          QUERY_ERR='sum(rate(http_requests_total{namespace="frd-staging",status=~"5.."}[5m]))*100/sum(rate(http_requests_total{namespace="frd-staging"}[5m]))'
          QUERY_P99='histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{namespace="frd-staging"}[5m])) by (le))*1000'
          QUERY_SUCC='sum(rate(http_requests_total{namespace="frd-staging",status=~"2..|3.."}[5m]))*100/sum(rate(http_requests_total{namespace="frd-staging"}[5m]))'
          is_num() { [[ "$1" =~ ^-?[0-9]+([.][0-9]+)?$ ]]; }
          DEADLINE=$((SECONDS + 1500))   # 最长观察 25min
          ATTEMPT=0
          while [ $SECONDS -lt $DEADLINE ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "== Canary metric check #${ATTEMPT} =="
            ERR=$(curl -sf --max-time 10 "$PROM_URL/api/v1/query" --data-urlencode "query=$QUERY_ERR" | jq -r '.data.result[0].value[1] // "nan"' 2>/dev/null || echo "nan")
            P99=$(curl -sf --max-time 10 "$PROM_URL/api/v1/query" --data-urlencode "query=$QUERY_P99" | jq -r '.data.result[0].value[1] // "nan"' 2>/dev/null || echo "nan")
            SUCC=$(curl -sf --max-time 10 "$PROM_URL/api/v1/query" --data-urlencode "query=$QUERY_SUCC" | jq -r '.data.result[0].value[1] // "nan"' 2>/dev/null || echo "nan")
            echo "err_rate=${ERR}% p99=${P99}ms success_rate=${SUCC}%"
            PASS=1
            if is_num "$ERR" && awk "BEGIN{exit !($ERR < 0.5)}"; then echo "  - 错误率 PASS"; else PASS=0; fi
            if is_num "$P99" && awk "BEGIN{exit !($P99 < 200)}"; then echo "  - P99 PASS"; else PASS=0; fi
            if is_num "$SUCC" && awk "BEGIN{exit !($SUCC > 99)}"; then echo "  - 成功率 PASS"; else PASS=0; fi
            if [ "$PASS" -eq 1 ]; then
              echo "Canary metrics PASS (attempt #${ATTEMPT})"
              exit 0
            fi
            echo "  - 等待 5 分钟窗口刷新..."
            sleep 300
          done
          echo "Canary metrics FAILED after 25min observation"
          exit 1

      - name: Promote canary to full rollout (Stage 2/3)
        if: success()
        run: |
          echo "Canary metrics PASS, 全量流量已指向新版本（weight 100%）"
          kubectl rollout status deployment/frd-backend -n frd-staging --timeout 300s || true
          echo "生产环境按 D10 §13.2 执行 5%→25%→100% 节奏（Argo Rollouts）"

      - name: Auto-rollback on failure
        if: failure()
        run: |
          echo "!! Canary check FAILED, triggering rollback"
          kubectl rollout undo deployment/frd-backend -n frd-staging || true
          kubectl rollout undo deployment/frd-frontend -n frd-staging || true
          kubectl rollout status deployment/frd-backend -n frd-staging --timeout 300s || true
          # 通知干系人
          echo "::warning::Staging canary rolled back, manual review required"

      - name: Summary
        if: always()
        run: |
          echo "## Staging Canary Status" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: ${{ needs.sync-images.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 指标判定（错误率<0.5% / P99<200ms / 成功率>99%）：${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 观察期：staging 24h 由 D10 §13.1 节奏控制（生产启用 Argo Rollouts）" >> "$GITHUB_STEP_SUMMARY"
