# ============================================================
# FRD 安全扫描流水线
# 依据：FRD-D10-V1.1 §10.1 AI Agent 自动 review
# 触发：PR + 每周一 02:00 UTC 定时
# 工具：Trivy（FS）/ Bandit（Python）/ Semgrep（多语言 SAST）/ dependency-check
# ============================================================
name: Security Scan

on:
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 2 * * 1"   # 每周一 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # ---------- Trivy 文件系统扫描 ----------
  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Trivy FS scan
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
        continue-on-error: true
      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # ---------- Bandit Python SAST ----------
  bandit:
    name: Bandit Python SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Bandit
        run: pip install bandit
      - name: Run Bandit
        run: |
          # bandit 原生不支持 SARIF，输出 JSON 留档
          bandit -r backend/app -f json -o bandit.json || true
          # 高危阻断（severity HIGH，confidence HIGH）
          bandit -r backend/app -lll -ii
        continue-on-error: true
      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit.json
          if-no-files-found: warn

  # ---------- Semgrep 多语言 SAST ----------
  semgrep:
    name: Semgrep Multi-language SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Semgrep scan
        run: |
          pip install semgrep
          # 产出 SARIF 供 code scanning 展示；规则命中不阻断（仅 HIGH confidence 在 Security 标签页可见）
          semgrep scan \
            --config p/default \
            --config p/owasp-top-ten \
            --config p/python \
            --config p/typescript \
            --config p/docker \
            --config p/kubernetes \
            --sarif \
            --output semgrep.sarif || true
        continue-on-error: true
      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ---------- 依赖漏洞检查 ----------
  dependency-check:
    name: Dependency Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Python 依赖（pip-audit）
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: pip-audit (backend)
        working-directory: backend
        run: |
          pip-audit \
            --requirement requirements.txt \
            --strict \
            --vulnerability-service osv
        continue-on-error: true
      # Node 依赖（npm audit）
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit (frontend)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
