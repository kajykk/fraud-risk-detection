# ============================================================
# Alembic 配置（FRD 金融反欺诈系统）
# 命令：alembic upgrade head / alembic revision --autogenerate -m "msg"
# ============================================================

[alembic]
# 迁移脚本目录
script_location = alembic

# 模板编码
sqlalchemy.url = driver://user:pass@localhost/dbname

# 时区
timezone = Asia/Shanghai

# 文件命名模板：时间_修订ID_描述.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s.py

# 版本表名
version_table = alembic_version

# 递归版本路径
recursive_version_locations = true
version_locations = alembic/versions

# 输出截断
truncate_slug_length = 40

# revisions 子目录
# 输出包含时间戳
output_encoding = utf-8

[post_write_hooks]
# 可选：迁移生成后自动格式化
# hooks = ruff
# ruff.type = console_scripts
# ruff.entrypoint = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
