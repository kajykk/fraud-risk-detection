# ============================================================
# FRD 金融反欺诈系统 - 本地开发环境
# 使用：docker compose up -d
# 停止：docker compose down
# 清理数据：docker compose down -v
# 凭据：一律由 .env 注入；以下服务使用 ${VAR:?} 强制要求，未设置则拒绝启动。
# ============================================================

services:
  # ---------- PostgreSQL 15 + TimescaleDB ----------
  postgres:
    image: timescale/timescaledb:2.14.2-pg15
    container_name: frd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-frd}
      POSTGRES_USER: ${POSTGRES_USER:-frd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      TS_TUNE_MEMORY: 2GB
      TS_TUNE_NUM_CPUS: 4
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-frd} -d ${POSTGRES_DB:-frd}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - frd-net

  # ---------- Redis 7 ----------
  redis:
    image: redis:7.4-alpine
    container_name: frd-redis
    restart: unless-stopped
    command: >
      sh -c 'exec redis-server
      --requirepass "$$REDIS_PASSWORD"
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - frd-net

  # ---------- Neo4j 5 ----------
  neo4j:
    image: neo4j:5.20-community
    container_name: frd-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set in .env}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_max__size: 1G
      NEO4J_dbms_memory_pagecache_size: 512M
    ports:
      - "7474:7474"   # HTTP Browser
      - "7687:7687"   # Bolt
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - frd-net

  # ---------- 后端 FastAPI ----------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: frd-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: local
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      NEO4J_URI: bolt://neo4j:7687
      # Redis 已开启 requirepass：Celery broker/backend 需携带密码（与 .env REDIS_PASSWORD 一致）
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379/2
      GNN_SERVICE_URL: http://gnn-serving:8502
      # 服务间鉴权（与 gnn-serving 的 GNN_API_KEY 保持一致）：
      # 可选项——留空则 gnn/ml 服务关闭鉴权（仅限本地开发），生产必须设置强随机值
      GNN_API_KEY: ${GNN_API_KEY:-}
      # ML 评分路径：backend 调 ml-serving 三模态推理；auto=失败自动回退启发式
      ML_ENGINE_MODE: ${ML_ENGINE_MODE:-auto}
      ML_SERVICE_URL: http://ml-serving:8501
      # 与 ml-serving 的 ML_API_KEY 保持一致（留空 = 关闭鉴权）
      ML_API_KEY: ${ML_API_KEY:-}
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/__pycache__
    command: >
      sh -c "PYTHONPATH=/app alembic upgrade head &&
             PYTHONPATH=/app uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - frd-net

  # ---------- Celery Worker ----------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: frd-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: local
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      NEO4J_URI: bolt://neo4j:7687
      # 与 backend 保持一致：broker/backend 携带 Redis 密码
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379/2
    depends_on:
      - backend
      - redis
    volumes:
      - ./backend:/app
      - /app/__pycache__
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    networks:
      - frd-net

  # ---------- Celery Beat (定时任务) ----------
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: frd-beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: local
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # 与 backend 保持一致：broker/backend 携带 Redis 密码
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379/2
    depends_on:
      - worker
    volumes:
      - ./backend:/app
      - /app/__pycache__
    command: celery -A app.workers.celery_app beat --loglevel=info
    networks:
      - frd-net

  # ---------- ML 评分推理服务 ----------
  ml-serving:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: frd-ml-serving
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # 服务间鉴权：可选项——留空则关闭鉴权（仅限本地开发），生产必须设置强随机值
      ML_API_KEY: ${ML_API_KEY:-}
    ports:
      - "8501:8501"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - frd-net

  # ---------- GNN 团伙检测服务 ----------
  gnn-serving:
    build:
      context: ./gnn
      dockerfile: Dockerfile
    container_name: frd-gnn-serving
    restart: unless-stopped
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set in .env}
      # 服务间鉴权：可选项——留空则关闭鉴权（仅限本地开发），生产必须设置强随机值
      GNN_API_KEY: ${GNN_API_KEY:-}
    ports:
      - "8502:8502"
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - frd-net

  # ---------- 前端 Vue 3.5 ----------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: frd-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8002/api/v1
    ports:
      - "5174:5173"
    volumes:
      - ./frontend:/app
    command: npm run dev -- --host 0.0.0.0
    networks:
      - frd-net

  # ---------- 可观测性：Prometheus ----------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: frd-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - frd-net

  # ---------- 可观测性：Grafana ----------
  grafana:
    image: grafana/grafana:11.2.0
    container_name: frd-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - frd-net

volumes:
  postgres-data:
  redis-data:
  neo4j-data:
  neo4j-logs:
  prometheus-data:
  grafana-data:

networks:
  frd-net:
    driver: bridge
